<!doctype html>
<!-- Weboberfläche von MarketLens (E10). Wird vom eigenen Server unter "/" ausgeliefert.
     Alle Dateien (HTML, CSS, JavaScript) liegen im Repository; es werden keine externen Dienste geladen. -->
<html lang="de">
<head>
  <!-- Zeichensatz UTF-8, damit Umlaute richtig angezeigt werden -->
  <meta charset="utf-8">
  <!-- Auf Smartphones in Gerätebreite anzeigen statt verkleinert -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Titel im Browser-Tab -->
  <title>MarketLens</title>
  <!-- Eigene Gestaltung (liegt im selben Ordner) -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Kopfzeile mit Name und Auswahl -->
  <header class="kopf">
    <!-- Name der Anwendung -->
    <h1>MarketLens</h1>
    <!-- Formular für Wertpapier und Zeitraum; "submit" wird in app.js abgefangen (kein Neuladen der Seite) -->
    <form id="auswahl" class="auswahl">
      <!-- Auswahl des Wertpapiers; die Einträge kommen von /api/wertpapiere -->
      <label>Wertpapier
        <select id="symbol" required></select>
      </label>
      <!-- Optionaler Zeitraum -->
      <label>von <input id="von" type="date"></label>
      <label>bis <input id="bis" type="date"></label>
      <!-- Startet das Laden -->
      <button type="submit">Anzeigen</button>
    </form>
  </header>

  <!-- Hauptbereich -->
  <main class="inhalt">
    <!-- Fehlermeldungen der Schnittstelle (leer und versteckt, solange es keine gibt) -->
    <div id="fehler" class="fehlerbereich" hidden></div>
    <!-- Hinweis auf veraltete Daten aus dem Cache (E7) -->
    <div id="hinweis" class="hinweis" hidden></div>

    <!-- Seitenleiste mit den Einstellungen der Indikatoren -->
    <aside class="einstellungen">
      <!-- Überschrift -->
      <h2>Indikatoren</h2>
      <!-- Jede Zeile: Ein/Aus und Periode. Die Standardwerte entsprechen denen der Schnittstelle (E8). -->
      <label class="zeile"><input id="zeigeSma" type="checkbox" checked> SMA <button type="button" class="hilfe" data-hilfe="sma">?</button>
        <input id="sma" class="zahl" type="number" min="1" value="20" title="Periode"></label>
      <label class="zeile"><input id="zeigeEma" type="checkbox" checked> EMA <button type="button" class="hilfe" data-hilfe="ema">?</button>
        <input id="ema" class="zahl" type="number" min="1" value="20" title="Periode"></label>
      <label class="zeile"><input id="zeigeBollinger" type="checkbox"> Bollinger <button type="button" class="hilfe" data-hilfe="bollinger">?</button>
        <input id="bollinger" class="text" type="text" value="20,2" title="Periode,k"></label>
      <label class="zeile"><input id="zeigeNiveaus" type="checkbox" checked> Support/Resistance <button type="button" class="hilfe" data-hilfe="niveaus">?</button></label>
      <label class="zeile"><input id="zeigePivot" type="checkbox"> Pivot-Punkte <button type="button" class="hilfe" data-hilfe="pivot">?</button></label>
      <label class="zeile"><input id="zeigeEreignisse" type="checkbox" checked> Zinsentscheidungen <button type="button" class="hilfe" data-hilfe="zinsmarkierung">?</button></label>
      <label class="zeile"><input id="zeigeRsi" type="checkbox" checked> RSI <button type="button" class="hilfe" data-hilfe="rsi">?</button>
        <input id="rsi" class="zahl" type="number" min="1" value="14" title="Periode"></label>
      <label class="zeile"><input id="zeigeMacd" type="checkbox" checked> MACD <button type="button" class="hilfe" data-hilfe="macd">?</button>
        <input id="macd" class="text" type="text" value="12,26,9" title="schnell,langsam,signal"></label>
      <!-- Hinweis, wann die Einstellungen wirken -->
      <p class="klein">Perioden wirken nach „Anzeigen“, Ein/Aus sofort. „?“: Erklärung beim Überfahren mit der Maus.</p>
    </aside>

    <!-- Diagramme -->
    <section class="diagramme">
      <!-- Name des Wertpapiers und letzter Kurs -->
      <h2 id="titel" class="titel">Bitte ein Wertpapier wählen</h2>
      <!-- Werkzeugleiste der Zeichenwerkzeuge (F1); die Logik steht in zeichnen.js -->
      <div id="werkzeuge" class="werkzeuge" role="toolbar" aria-label="Zeichenwerkzeuge">
        <!-- Werkzeuge; data-werkzeug ist der Typ in zeichnen.js -->
        <button type="button" data-werkzeug="auswahl">Auswählen</button>
        <button type="button" data-werkzeug="trend">Trendlinie</button>
        <button type="button" data-werkzeug="strahl">Strahl</button>
        <button type="button" data-werkzeug="waagrecht">Waagrechte</button>
        <button type="button" data-werkzeug="zone">Zone</button>
        <button type="button" data-werkzeug="fibonacci">Fibonacci</button>
        <!-- Magnet: Klick rastet auf Open/High/Low/Close der Kerze ein -->
        <label class="magnet"><input id="magnet" type="checkbox" checked> Magnet</label>
        <!-- Bearbeiten -->
        <button type="button" id="zeichnungLoeschen" title="Entf">Löschen</button>
        <button type="button" id="rueckgaengig" title="Strg+Z">Rückgängig</button>
        <button type="button" id="alleLoeschen">Alle löschen</button>
        <!-- Erklärung aller Werkzeuge (F2) -->
        <button type="button" class="hilfe" data-hilfe="zeichenwerkzeuge">?</button>
        <!-- Anleitung zum gewählten Werkzeug oder Hinweis zum Speicher -->
        <span id="zeichenHinweis" class="klein"></span>
      </div>
      <!-- Kursdiagramm; das SVG zeichnet app.js -->
      <div class="diagramm haupt"><svg id="kurschart" role="img" aria-label="Kursdiagramm"></svg>
        <!-- Erklärung des Diagramms (F2), oben rechts -->
        <span class="diagramm-hilfe"><button type="button" class="hilfe" data-hilfe="kursdiagramm">?</button></span>
        <!-- Infokasten beim Überfahren mit der Maus -->
        <div id="info" class="info" hidden></div></div>
      <!-- RSI-Diagramm -->
      <div id="rsiBox" class="diagramm klein-diagramm"><svg id="rsichart" role="img" aria-label="RSI"></svg>
        <span class="diagramm-hilfe"><button type="button" class="hilfe" data-hilfe="rsi">?</button></span></div>
      <!-- MACD-Diagramm -->
      <div id="macdBox" class="diagramm klein-diagramm"><svg id="macdchart" role="img" aria-label="MACD"></svg>
        <span class="diagramm-hilfe"><button type="button" class="hilfe" data-hilfe="macd">?</button></span></div>
    </section>

    <!-- Kennzahlen (Volatilität, Drawdown, Pivot-Punkte) -->
    <section class="kennzahlen">
      <!-- Überschrift -->
      <h2>Kennzahlen</h2>
      <!-- Wird von app.js gefüllt -->
      <dl id="kennzahlen"></dl>
    </section>

    <!-- Ereignisstudie (E6) -->
    <section class="ereignisse">
      <!-- Überschrift -->
      <h2>Ereignisstudie: Zinsentscheidungen <button type="button" class="hilfe" data-hilfe="ereignisstudie">?</button></h2>
      <!-- Erklärung des Datums (E6: Tag der Wirksamkeit, nicht der Sitzung) -->
      <p id="ereignisHinweis" class="klein"></p>
      <!-- Tabelle; in einem Rahmen, der auf schmalen Bildschirmen seitlich scrollt -->
      <div class="tabellenrahmen">
        <table>
          <!-- Spaltenköpfe -->
          <thead><tr><th>Zentralbank <button type="button" class="hilfe" data-hilfe="zentralbank">?</button></th><th>Wirksam ab <button type="button" class="hilfe" data-hilfe="wirksamAb">?</button></th>
            <th>Leitzins <button type="button" class="hilfe" data-hilfe="leitzins">?</button></th><th>Reaktionstag <button type="button" class="hilfe" data-hilfe="reaktionstag">?</button></th>
            <th>Kurs vorher <button type="button" class="hilfe" data-hilfe="kursVorher">?</button></th><th>Kurs nachher <button type="button" class="hilfe" data-hilfe="kursNachher">?</button></th>
            <th>Veränderung <button type="button" class="hilfe" data-hilfe="veraenderungEreignis">?</button></th></tr></thead>
          <!-- Zeilen füllt app.js -->
          <tbody id="ereignisTabelle"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Programmlogik der Seite; am Ende, damit alle Elemente oben schon existieren.
       zeichnen.js zuerst, weil app.js das Objekt "Zeichnen" daraus benutzt (F1). -->
  <script src="zeichnen.js"></script>
  <!-- Erklärungen zu allen Zahlen (F2); ebenfalls vor app.js, das Hilfe benutzt -->
  <script src="erklaerungen.js"></script>
  <script src="app.js"></script>
</body>
</html>
